services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hexon
      POSTGRES_PASSWORD: hexon
      POSTGRES_DB: hexon_locations
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexon -d hexon_locations"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
